<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Arus Toko | Kelola Keuangan Toko</title>

    <link rel="stylesheet" href="css/main.css" />
  </head>
  <body>
    <div class="auth-layout">
      <main class="auth-layout__main">
        <div class="auth-layout__content">
          <header class="heading heading--center">
            <h1 class="heading__title">Daftar untuk Akun <Baru></Baru></h1>
            <p class="heading__description">
              Selamat Datang! Daftar untuk mengelola keuangan toko Anda
            </p>
          </header>
          <button class="btn btn--outline btn--full" type="button">
            <img class="btn__icon" src="assets/icons/google-icon.svg" alt="" />
            Daftar dengan Google
          </button>
          <button class="btn btn--outline btn--full" type="button">
            <img
              class="btn__icon"
              src="assets/icons/facebook-icon.svg"
              alt=""
            />
            Daftar dengan Facebook
          </button>
          <div class="divider">
            <span>atau</span>
          </div>
          <form class="auth-form" action="">
            <div class="form-field">
              <label for="username">Username</label>
              <input
                class="input"
                type="text"
                id="username"
                name="username"
                autocomplete="username"
                placeholder="Masukkan username Anda"
                required
              />
            </div>
            <div class="form-field">
              <label for="email">Email</label>
              <input
                class="input"
                type="email"
                id="email"
                name="email"
                autocomplete="email"
                placeholder="Masukkan email Anda"
                required
              />
            </div>
            <div class="form-field">
              <label for="password">Buat Password Baru</label>
              <input
                class="input"
                type="password"
                id="password"
                name="password"
                autocomplete="current-password"
                placeholder="Minimal 8 karakter"
                required
              />
            </div>
            <div class="form-field">
              <label for="confirm-password">Konfirmasi Password</label>
              <input
                class="input"
                type="password"
                id="confirm-password"
                name="confirm-password"
                autocomplete="new-password"
                placeholder="Ulangi password"
                required
              />
            </div>
            <button
              class="btn btn--primary btn--full auth-form__submit"
              type="submit"
            >
              Daftar
            </button>
          </form>
          <p class="u-text-secondary u-text-center">
            Sudah punya akun?
            <a href="index.html">Masuk sekarang</a>
          </p>
        </div>
      </main>

      <aside class="auth-layout__aside"></aside>
    </div>
  </body>
</html>
