<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Arus Toko | Kelola Keuangan Toko</title>

    <link rel="stylesheet" href="css/main.css" />
  </head>
  <body>
    <div class="auth-layout">
      <main class="auth-layout__main">
        <div class="auth-layout__content">
          <header class="heading heading--center">
            <h1 class="heading__title">Masuk ke Akun Anda</h1>
            <p class="heading__description">
              Selamat Datang! Masuk untuk mengelola keuangan toko Anda
            </p>
          </header>
          <button class="btn btn--outline btn--full" type="button">
            <img class="btn__icon" src="assets/icons/google-icon.svg" alt="" />
            Masuk dengan Google
          </button>
          <button class="btn btn--outline btn--full" type="button">
            <img
              class="btn__icon"
              src="assets/icons/facebook-icon.svg"
              alt=""
            />
            Masuk dengan Facebook
          </button>
          <div class="divider">
            <span>atau</span>
          </div>
          <form class="auth-form" action="">
            <div class="form-field">
              <label for="email">Email</label>
              <input
                class="input"
                type="email"
                id="email"
                name="email"
                autocomplete="email"
                placeholder="Masukkan email Anda"
                required
              />
            </div>
            <div class="form-field">
              <label for="password">Password</label>
              <input
                class="input"
                type="password"
                id="password"
                name="password"
                autocomplete="current-password"
                placeholder="Masukkan password Anda"
                required
              />
            </div>
            <div class="u-flex u-justify-center u-gap-8">
              <div class="checkbox">
                <input type="checkbox" id="remember" name="remember" />
                <label for="remember">Ingat saya</label>
              </div>
              <a href="">Lupa Password?</a>
            </div>
            <button
              class="btn btn--primary btn--full auth-form__submit"
              type="submit"
            >
              Masuk
            </button>
          </form>
          <p class="u-text-secondary u-text-center">
            Belum punya akun?
            <a href="">Daftar sekarang</a>
          </p>
        </div>
      </main>
      <aside class="auth-layout__aside"></aside>
    </div>

    <script src="js/main.js"></script>
  </body>
</html>
