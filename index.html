<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Arus Toko | Kelola Keuangan Toko</title>

    <link rel="stylesheet" href="css/main.css" />
  </head>
  <body>
    <div class="auth-layout">
      <main>
        <h1 class="u-text-center">Masuk ke Akun Anda</h1>
        <p class="u-text-secondary u-text-center">
          Selamat Datang! Masuk untuk mengelola keuangan toko Anda
        </p>

        <button class="btn btn--outline btn--full" type="button">
          <img class="btn__icon" src="assets/icons/google-icon.svg" alt="" />
          Masuk dengan Google
        </button>
        <button class="btn btn--outline btn--full" type="button">
          <img class="btn__icon" src="assets/icons/facebook-icon.svg" alt="" />
          Masuk dengan Facebook
        </button>

        <div class="divider">
          <span>atau</span>
        </div>

        <form action="">
          <label for="email">Email</label>
          <input
            class="input"
            type="email"
            id="email"
            name="email"
            autocomplete="email"
            placeholder="Masukkan email Anda"
            required
          />

          <label for="password">Password</label>
          <input
            class="input"
            type="password"
            id="password"
            name="password"
            autocomplete="current-password"
            placeholder="Masukkan password Anda"
            required
          />

          <div class="u-flex u-justify-center u-gap-8">
            <div class="checkbox">
              <input type="checkbox" id="remember" name="remember" />
              <label for="remember">Ingat saya</label>
            </div>
            <a href="">Lupa Password?</a>
          </div>

          <button class="btn btn--primary btn--full" type="submit">
            Masuk
          </button>
        </form>

        <p class="u-text-secondary u-text-center">
          Belum punya akun?
          <a href="">Daftar sekarang</a>
        </p>
      </main>
      <aside></aside>
    </div>

    <script src="js/main.js"></script>
  </body>
</html>
